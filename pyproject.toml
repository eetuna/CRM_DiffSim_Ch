[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "cmake>=3.17",
    "pybind11>=2.6.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "crm-catheter"
version = "1.0.0"
description = "Cosserat Rod Model for MRI-Actuated Robotic Catheter with ML/AI Integration"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["robotics", "continuum", "catheter", "machine-learning", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "torch>=2.0.0",
    "gymnasium>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
    "sphinx>=6.2.0",
    "sphinx-rtd-theme>=1.2.0",
]

rl = [
    "stable-baselines3>=2.0.0",
    "tensorboard>=2.13.0",
    "wandb>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/CRM_Dynamics"
Documentation = "https://crm-catheter.readthedocs.io/"
Repository = "https://github.com/yourusername/CRM_Dynamics"
"Bug Tracker" = "https://github.com/yourusername/CRM_Dynamics/issues"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=crm_catheter --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
